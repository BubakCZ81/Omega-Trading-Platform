<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omega Pine Editor</title>
  </head>
  <body>
    <main class="pine-editor-window">
      <header class="pine-editor-toolbar">
        <div class="pine-editor-toolbar-group">
          <strong>OMEGA PINE EDITOR <span>(v6)</span></strong>
          <select id="script-select" aria-label="Pine script"></select>
          <button id="new-script" type="button">New</button>
          <button id="save-script" type="button">Save</button>
          <button id="delete-script" type="button">Delete</button>
          <button id="export-script" type="button">Export</button>
        </div>
        <div class="pine-editor-toolbar-group pine-editor-actions">
          <button id="add-to-chart" type="button">Add to chart</button>
          <button id="update-chart" type="button">Update chart</button>
          <button id="toggle-reference" type="button" aria-expanded="true">Pine docs</button>
          <span id="editor-status" role="status" aria-live="polite">Ready</span>
        </div>
      </header>
      <section class="pine-editor-content">
        <div id="code-editor" aria-label="Pine code editor"></div>
        <div id="pine-reference-resize" role="separator" aria-label="Resize Pine documentation panel"
          aria-orientation="vertical" aria-valuemin="250" aria-valuenow="320" aria-keyshortcuts="ArrowLeft ArrowRight"
          tabindex="0" title="Drag to resize Pine documentation"></div>
        <aside id="pine-reference" aria-label="Pine method documentation">
          <div class="pine-reference-heading">
            <strong>Pine documentation</strong>
            <button id="close-reference" type="button" aria-label="Close Pine documentation">Close</button>
          </div>
          <input id="pine-reference-search" type="search" placeholder="Search Pine methods…" aria-label="Search Pine methods" />
          <div id="pine-reference-list"></div>
        </aside>
      </section>
    </main>
    <script type="module" src="./src/pineEditorStandalone.ts"></script>
  </body>
</html>
